  <p class="lede">A maior parte do valor dos testes automatizados não está na tela que o usuário vê. Está nas camadas abaixo dela: mais rápidas, mais baratas de manter e mais fáceis de diagnosticar. Role o texto ou clique em uma camada do iceberg.</p>

    <div class="readout" id="readout" aria-live="polite"><span>Camada atual:</span> <strong id="readoutName">superfície</strong></div>

  <article class="article">
    <section class="intro">
      <h2>Por que um iceberg?</h2>
      <p>Testes de interface são a parte visível. Eles são fáceis de demonstrar e de entender, porque repetem o que uma pessoa faria no produto. Mas são a menor fatia de uma boa estratégia.</p>
      <p>Cada camada abaixo cobre um tipo diferente de falha. E, quanto mais fundo, mais rápido o feedback: um teste unitário roda em milissegundos, um teste de UI pode levar minutos.</p>
      <p>Este artigo percorre as seis camadas do iceberg, de cima para baixo, com as ferramentas típicas de cada uma.</p>
      <p class="note">As notas de velocidade, estabilidade e realismo são uma referência geral, não medições. Elas variam bastante de projeto para projeto.</p>
    </section>

    <section class="layer" id="ui" data-layer="ui" style="--c:var(--b1)" data-name="Testes de UI" data-depth="superfície">
      <h2>Testes de UI</h2>
      <p>Controlam um navegador ou um app móvel como uma pessoa faria: clicam, digitam e esperam a tela mudar. São a única camada que enxerga o produto inteiro funcionando junto.</p>
      <ul class="chips"><li>Playwright</li><li>Cypress</li><li>Selenium</li><li>Appium</li></ul>
      <p>Playwright, Cypress e Selenium automatizam a web. Appium faz o mesmo para aplicativos móveis.</p>
      <h3>Quando usar</h3>
      <p>Para poucos fluxos críticos de ponta a ponta, como login, busca e pagamento. Eles confirmam que as camadas de baixo, somadas, entregam uma experiência que funciona.</p>
      <h3>O que cuidar</h3>
      <p>São os mais lentos e os mais sujeitos a falhas intermitentes (os testes “flaky”), porque dependem de rede, animações e do ambiente inteiro. Se você testa regra de negócio pela tela, cada mudança visual quebra dezenas de testes.</p>
      <p><strong>Regra prática:</strong> se dá para verificar em uma camada abaixo, verifique lá.</p>
      <div class="meters" data-m="1,2,5"></div>
    </section>

    <section class="layer" id="db" data-layer="db" style="--c:var(--b1)" data-name="Testes de banco de dados" data-depth="10 m">
      <h2>Testes de banco de dados</h2>
      <p>Verificam o esquema, as migrations, as consultas e as regras que vivem no próprio banco, como constraints, triggers e procedures.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit prepara e compara conjuntos de dados. Flyway aplica migrations versionadas, então rodá-las em um banco vazio na integração contínua já revela muitos erros. SQLTest cobre rotinas e consultas escritas em SQL.</p>
      <h3>Quando usar</h3>
      <p>Para validar migrations, consultas críticas de relatório e a integridade dos dados: chaves, unicidade e valores obrigatórios.</p>
      <h3>O que cuidar</h3>
      <p>Cada execução precisa começar de um estado conhecido. Um banco compartilhado entre testes cria dependências invisíveis: um teste passa só porque outro rodou antes.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)" data-name="Testes de integração" data-depth="20 m">
      <h2>Testes de integração</h2>
      <p>Verificam que duas ou mais partes reais conversam bem: seu serviço com o banco, com uma fila de mensagens ou com outro serviço.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers sobe dependências reais, como bancos e brokers, em contêineres descartáveis. WireMock simula APIs externas, inclusive respostas lentas e erros. Pytest organiza e executa tudo.</p>
      <h3>Quando usar</h3>
      <p>Para os pontos de contato entre sistemas: como seu código reage a um timeout de um serviço de terceiros, a uma resposta inesperada ou a uma mensagem duplicada.</p>
      <h3>O que cuidar</h3>
      <p>São mais lentos que os unitários. Concentre-os nas fronteiras e não repita aqui a lógica de negócio que já está coberta embaixo.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)" data-name="Testes de API" data-depth="30 m">
      <h2>Testes de API</h2>
      <p>Chamam os endpoints diretamente, sem passar pela tela. Verificam status, corpo da resposta, contrato, autenticação e as regras de negócio expostas pelo serviço.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman é ótimo para explorar e montar coleções. Rest Assured (Java), Jest (JavaScript) e Pytest + Requests (Python) permitem escrever os testes como código, versionados junto com o projeto.</p>
      <h3>Quando usar</h3>
      <p>Para validar contratos, permissões e casos de erro: campos ausentes, tokens inválidos, recursos inexistentes. É a camada com melhor relação entre custo e confiança para quem consome a API.</p>
      <h3>O que cuidar</h3>
      <p>Um contrato que muda sem aviso quebra os consumidores. Se vários times dependem da mesma API, considere adicionar testes de contrato.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)" data-name="Testes de componente" data-depth="40 m">
      <h2>Testes de componente e módulo</h2>
      <p>Testam uma peça da interface isolada. Renderizam o componente, simulam cliques e digitação e verificam o que aparece, sem subir o app inteiro nem o backend real.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>As duas bibliotecas incentivam testar pelo que a pessoa percebe na tela, e não pelos detalhes internos de implementação.</p>
      <h3>Quando usar</h3>
      <p>Para os estados de um componente: carregando, vazio, com erro. Também para validação de formulário e comportamento de botões e menus.</p>
      <h3>O que cuidar</h3>
      <p>Testar o estado interno do componente deixa a suíte frágil: qualquer refatoração quebra testes mesmo sem mudar o comportamento. Prefira verificar o resultado visível.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)" data-name="Testes unitários" data-depth="50 m">
      <h2>Testes unitários</h2>
      <p>Testam a menor parte do código, uma função ou uma classe, isolada do resto. Rodam em milissegundos e apontam a linha exata onde algo quebrou. São a base de toda a suíte.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit é o padrão em Java, NUnit em .NET, Pytest em Python e Mocha em JavaScript.</p>
      <h3>Quando usar</h3>
      <p>Para regras de cálculo, validações e casos limite: valores zero, negativos, vazios, muito grandes.</p>
      <h3>O que cuidar</h3>
      <p>Mocks demais fazem o teste passar enquanto o sistema falha. E testes unitários sozinhos não provam que as partes se encaixam, por isso existem as camadas de cima.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">Qual camada pegaria este bug?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>Como montar a suíte</h2>
      <p>Comece pela base e suba conforme o risco. Muitos testes unitários, uma boa cobertura de API e integração nos pontos críticos, e poucos testes de UI para os fluxos que não podem falhar.</p>
      <p>O objetivo não é ter uma camada de cada tipo. É que toda falha provável seja pega na camada mais barata capaz de enxergá-la.</p>
    </section>
  </article>
</main>

  <article class="article">
    <section class="intro">
      <h2>Why an iceberg?</h2>
      <p>UI tests are the visible part. They are easy to demo and easy to understand, because they repeat what a person would do in the product. But they are the smallest slice of a good strategy.</p>
      <p>Each layer below covers a different kind of failure. And the deeper you go, the faster the feedback: a unit test runs in milliseconds, a UI test can take minutes.</p>
      <p>This article walks through the six layers of the iceberg, from top to bottom, with the typical tools for each.</p>
      <p class="note">The speed, stability and realism ratings are a general reference, not measurements. They vary a lot from project to project.</p>
    </section>

    <section class="layer" id="ui" data-layer="ui" style="--c:var(--b1)">
      <h2>UI tests</h2>
      <p>They drive a browser or a mobile app the way a person would: they click, type and wait for the screen to change. This is the only layer that sees the whole product working together.</p>
      <ul class="chips"><li>Playwright</li><li>Cypress</li><li>Selenium</li><li>Appium</li></ul>
      <p>Playwright, Cypress and Selenium automate the web. Appium does the same for mobile apps.</p>
      <h3>When to use it</h3>
      <p>For a few critical end-to-end flows, such as login, search and checkout. They confirm that the layers below, added together, deliver an experience that works.</p>
      <h3>What to watch for</h3>
      <p>They are the slowest and the most prone to intermittent failures (“flaky” tests), because they depend on the network, animations and the whole environment. If you test business rules through the screen, every visual change breaks dozens of tests.</p>
      <p><strong>Rule of thumb:</strong> if you can verify it one layer down, verify it there.</p>
      <div class="meters" data-m="1,2,5"></div>
    </section>

    <section class="layer" id="db" data-layer="db" style="--c:var(--b1)">
      <h2>Database tests</h2>
      <p>They check the schema, migrations, queries and the rules that live in the database itself, such as constraints, triggers and stored procedures.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit sets up and compares datasets. Flyway applies versioned migrations, so running them against an empty database in continuous integration already reveals many errors. SQLTest covers routines and queries written in SQL.</p>
      <h3>When to use it</h3>
      <p>To validate migrations, critical reporting queries and data integrity: keys, uniqueness and required values.</p>
      <h3>What to watch for</h3>
      <p>Every run must start from a known state. A database shared between tests creates invisible dependencies: one test passes only because another ran before it.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)">
      <h2>Integration tests</h2>
      <p>They check that two or more real parts work well together: your service with the database, with a message queue or with another service.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers starts real dependencies, such as databases and brokers, in disposable containers. WireMock simulates external APIs, including slow responses and errors. Pytest organizes and runs everything.</p>
      <h3>When to use it</h3>
      <p>For the points of contact between systems: how your code reacts to a timeout from a third-party service, an unexpected response or a duplicated message.</p>
      <h3>What to watch for</h3>
      <p>They are slower than unit tests. Concentrate them on the boundaries and don't repeat here the business logic that is already covered below.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)">
      <h2>API tests</h2>
      <p>They call the endpoints directly, without going through the screen. They check status codes, response bodies, contracts, authentication and the business rules the service exposes.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman is great for exploring and building collections. Rest Assured (Java), Jest (JavaScript) and Pytest + Requests (Python) let you write the tests as code, versioned alongside the project.</p>
      <h3>When to use it</h3>
      <p>To validate contracts, permissions and error cases: missing fields, invalid tokens, nonexistent resources. It is the layer with the best ratio of cost to confidence for anyone who consumes the API.</p>
      <h3>What to watch for</h3>
      <p>A contract that changes without notice breaks its consumers. If several teams depend on the same API, consider adding contract tests.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)">
      <h2>Component and module tests</h2>
      <p>They test one piece of the interface in isolation. They render the component, simulate clicks and typing and check what appears, without starting the whole app or the real backend.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>Both libraries encourage testing what the person perceives on screen, not internal implementation details.</p>
      <h3>When to use it</h3>
      <p>For a component's states: loading, empty, error. Also for form validation and the behavior of buttons and menus.</p>
      <h3>What to watch for</h3>
      <p>Testing a component's internal state makes the suite brittle: any refactor breaks tests even when the behavior hasn't changed. Prefer checking the visible result.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)">
      <h2>Unit tests</h2>
      <p>They test the smallest piece of code, a function or a class, isolated from everything else. They run in milliseconds and point to the exact line where something broke. They are the foundation of the whole suite.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit is the standard in Java, NUnit in .NET, Pytest in Python and Mocha in JavaScript.</p>
      <h3>When to use it</h3>
      <p>For calculation rules, validations and edge cases: zero, negative, empty and very large values.</p>
      <h3>What to watch for</h3>
      <p>Too many mocks let a test pass while the system fails. And unit tests alone don't prove the parts fit together, which is why the upper layers exist.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">Which layer would catch this bug?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>How to build the suite</h2>
      <p>Start at the base and climb according to risk. Many unit tests, solid API coverage and integration at the critical points, and few UI tests for the flows that cannot fail.</p>
      <p>The goal isn't to have one layer of every kind. It's for every likely failure to be caught at the cheapest layer able to see it.</p>
    </section>
  </article>

    <section class="intro">
      <h2>¿Por qué un iceberg?</h2>
      <p>Las pruebas de interfaz son la parte visible. Son fáciles de mostrar y de entender, porque repiten lo que haría una persona en el producto. Pero son la porción más pequeña de una buena estrategia.</p>
      <p>Cada capa de abajo cubre un tipo distinto de fallo. Y cuanto más profundo, más rápido el feedback: una prueba unitaria se ejecuta en milisegundos; una prueba de UI puede tardar minutos.</p>
      <p>Este artículo recorre las seis capas del iceberg, de arriba abajo, con las herramientas típicas de cada una.</p>
      <p class="note">Las notas de velocidad, estabilidad y realismo son una referencia general, no mediciones. Varían mucho de un proyecto a otro.</p>
    </section>

    <section class="layer" id="ui" data-layer="ui" style="--c:var(--b1)">
      <h2>Pruebas de UI</h2>
      <p>Controlan un navegador o una app móvil como lo haría una persona: hacen clic, escriben y esperan a que cambie la pantalla. Es la única capa que ve todo el producto funcionando en conjunto.</p>
      <ul class="chips"><li>Playwright</li><li>Cypress</li><li>Selenium</li><li>Appium</li></ul>
      <p>Playwright, Cypress y Selenium automatizan la web. Appium hace lo mismo con las aplicaciones móviles.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para unos pocos flujos críticos de extremo a extremo, como inicio de sesión, búsqueda y pago. Confirman que las capas de abajo, sumadas, entregan una experiencia que funciona.</p>
      <h3>Qué vigilar</h3>
      <p>Son las más lentas y las más propensas a fallos intermitentes (las pruebas “flaky”), porque dependen de la red, de las animaciones y de todo el entorno. Si pruebas reglas de negocio desde la pantalla, cada cambio visual rompe decenas de pruebas.</p>
      <p><strong>Regla práctica:</strong> si puedes verificarlo una capa más abajo, verifícalo allí.</p>
      <div class="meters" data-m="1,2,5"></div>
    </section>

    <section class="layer" id="db" data-layer="db" style="--c:var(--b1)">
      <h2>Pruebas de base de datos</h2>
      <p>Verifican el esquema, las migraciones, las consultas y las reglas que viven en la propia base de datos, como restricciones, triggers y procedimientos almacenados.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit prepara y compara conjuntos de datos. Flyway aplica migraciones versionadas, así que ejecutarlas sobre una base vacía en la integración continua ya revela muchos errores. SQLTest cubre rutinas y consultas escritas en SQL.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para validar migraciones, consultas críticas de informes y la integridad de los datos: claves, unicidad y valores obligatorios.</p>
      <h3>Qué vigilar</h3>
      <p>Cada ejecución debe empezar desde un estado conocido. Una base compartida entre pruebas crea dependencias invisibles: una prueba pasa solo porque otra se ejecutó antes.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)">
      <h2>Pruebas de integración</h2>
      <p>Verifican que dos o más partes reales se entienden bien: tu servicio con la base de datos, con una cola de mensajes o con otro servicio.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers levanta dependencias reales, como bases de datos y brokers, en contenedores desechables. WireMock simula APIs externas, incluidas respuestas lentas y errores. Pytest organiza y ejecuta todo.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para los puntos de contacto entre sistemas: cómo reacciona tu código ante un timeout de un servicio de terceros, una respuesta inesperada o un mensaje duplicado.</p>
      <h3>Qué vigilar</h3>
      <p>Son más lentas que las unitarias. Concéntralas en las fronteras y no repitas aquí la lógica de negocio que ya está cubierta abajo.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)">
      <h2>Pruebas de API</h2>
      <p>Llaman directamente a los endpoints, sin pasar por la pantalla. Verifican códigos de estado, cuerpo de la respuesta, contrato, autenticación y las reglas de negocio que expone el servicio.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman es ideal para explorar y armar colecciones. Rest Assured (Java), Jest (JavaScript) y Pytest + Requests (Python) permiten escribir las pruebas como código, versionadas junto con el proyecto.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para validar contratos, permisos y casos de error: campos ausentes, tokens inválidos, recursos inexistentes. Es la capa con mejor relación entre costo y confianza para quien consume la API.</p>
      <h3>Qué vigilar</h3>
      <p>Un contrato que cambia sin aviso rompe a sus consumidores. Si varios equipos dependen de la misma API, considera añadir pruebas de contrato.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)">
      <h2>Pruebas de componentes y módulos</h2>
      <p>Prueban una pieza de la interfaz de forma aislada. Renderizan el componente, simulan clics y escritura y verifican lo que aparece, sin levantar la app completa ni el backend real.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>Ambas bibliotecas fomentan probar lo que la persona percibe en pantalla, y no los detalles internos de implementación.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para los estados de un componente: cargando, vacío, con error. También para la validación de formularios y el comportamiento de botones y menús.</p>
      <h3>Qué vigilar</h3>
      <p>Probar el estado interno del componente vuelve frágil la suite: cualquier refactorización rompe pruebas aunque el comportamiento no haya cambiado. Prefiere verificar el resultado visible.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)">
      <h2>Pruebas unitarias</h2>
      <p>Prueban la parte más pequeña del código, una función o una clase, aislada del resto. Se ejecutan en milisegundos y señalan la línea exacta donde algo falló. Son la base de toda la suite.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit es el estándar en Java, NUnit en .NET, Pytest en Python y Mocha en JavaScript.</p>
      <h3>Cuándo usarlas</h3>
      <p>Para reglas de cálculo, validaciones y casos límite: valores cero, negativos, vacíos, muy grandes.</p>
      <h3>Qué vigilar</h3>
      <p>Demasiados mocks hacen que la prueba pase mientras el sistema falla. Y las pruebas unitarias por sí solas no demuestran que las partes encajen, por eso existen las capas de arriba.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">¿Qué capa detectaría este bug?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>Cómo armar la suite</h2>
      <p>Empieza por la base y sube según el riesgo. Muchas pruebas unitarias, buena cobertura de API e integración en los puntos críticos, y pocas pruebas de UI para los flujos que no pueden fallar.</p>
      <p>El objetivo no es tener una capa de cada tipo. Es que cada fallo probable se detecte en la capa más barata capaz de verlo.</p>
    </section>

      <h2>Tests de base de données</h2>
      <p>Ils vérifient le schéma, les migrations, les requêtes et les règles qui vivent dans la base elle-même, comme les contraintes, les triggers et les procédures stockées.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit prépare et compare des jeux de données. Flyway applique des migrations versionnées : les exécuter sur une base vide dans l’intégration continue révèle déjà beaucoup d’erreurs. SQLTest couvre les routines et les requêtes écrites en SQL.</p>
      <h3>Quand l’utiliser</h3>
      <p>Pour valider les migrations, les requêtes critiques de reporting et l’intégrité des données : clés, unicité et valeurs obligatoires.</p>
      <h3>Points de vigilance</h3>
      <p>Chaque exécution doit partir d’un état connu. Une base partagée entre les tests crée des dépendances invisibles : un test ne passe que parce qu’un autre s’est exécuté avant lui.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)">
      <h2>Tests d’intégration</h2>
      <p>Ils vérifient que deux parties réelles ou plus fonctionnent bien ensemble : votre service avec la base de données, avec une file de messages ou avec un autre service.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers démarre de vraies dépendances, comme des bases de données et des brokers, dans des conteneurs jetables. WireMock simule des API externes, y compris les réponses lentes et les erreurs. Pytest organise et exécute le tout.</p>
      <h3>Quand l’utiliser</h3>
      <p>Pour les points de contact entre systèmes : comment votre code réagit à un timeout d’un service tiers, à une réponse inattendue ou à un message en double.</p>
      <h3>Points de vigilance</h3>
      <p>Ils sont plus lents que les tests unitaires. Concentrez-les sur les frontières et ne répétez pas ici la logique métier déjà couverte plus bas.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)">
      <h2>Tests d’API</h2>
      <p>Ils appellent directement les endpoints, sans passer par l’écran. Ils vérifient les codes de statut, le corps des réponses, le contrat, l’authentification et les règles métier exposées par le service.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman est excellent pour explorer et construire des collections. Rest Assured (Java), Jest (JavaScript) et Pytest + Requests (Python) permettent d’écrire les tests sous forme de code, versionnés avec le projet.</p>
      <h3>Quand l’utiliser</h3>
      <p>Pour valider les contrats, les permissions et les cas d’erreur : champs manquants, jetons invalides, ressources inexistantes. C’est la couche au meilleur rapport coût-confiance pour ceux qui consomment l’API.</p>
      <h3>Points de vigilance</h3>
      <p>Un contrat qui change sans prévenir casse ses consommateurs. Si plusieurs équipes dépendent de la même API, envisagez d’ajouter des tests de contrat.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)">
      <h2>Tests de composants et de modules</h2>
      <p>Ils testent un morceau de l’interface de façon isolée. Ils affichent le composant, simulent des clics et de la saisie et vérifient ce qui apparaît, sans démarrer toute l’application ni le vrai backend.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>Ces deux bibliothèques encouragent à tester ce que la personne perçoit à l’écran, et non les détails internes d’implémentation.</p>
      <h3>Quand l’utiliser</h3>
      <p>Pour les états d’un composant : chargement, vide, erreur. Aussi pour la validation de formulaires et le comportement des boutons et des menus.</p>
      <h3>Points de vigilance</h3>
      <p>Tester l’état interne d’un composant rend la suite fragile : n’importe quel refactoring casse des tests alors que le comportement n’a pas changé. Préférez vérifier le résultat visible.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)">
      <h2>Tests unitaires</h2>
      <p>Ils testent la plus petite partie du code, une fonction ou une classe, isolée du reste. Ils s’exécutent en millisecondes et indiquent la ligne exacte où quelque chose a cassé. Ils constituent la base de toute la suite.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit est la référence en Java, NUnit en .NET, Pytest en Python et Mocha en JavaScript.</p>
      <h3>Quand l’utiliser</h3>
      <p>Pour les règles de calcul, les validations et les cas limites : valeurs nulles, négatives, vides, très grandes.</p>
      <h3>Points de vigilance</h3>
      <p>Trop de mocks font passer un test alors que le système échoue. Et les tests unitaires seuls ne prouvent pas que les pièces s’emboîtent, d’où l’existence des couches supérieures.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">Quelle couche détecterait ce bug ?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>Comment construire la suite</h2>
      <p>Commencez par la base et montez selon le risque. Beaucoup de tests unitaires, une bonne couverture d’API et de l’intégration aux points critiques, et peu de tests d’UI pour les parcours qui ne peuvent pas échouer.</p>
      <p>Le but n’est pas d’avoir une couche de chaque type. C’est que chaque défaillance probable soit détectée par la couche la moins coûteuse capable de la voir.</p>
    </section>
  </article>
</main>

  <article class="article">
    <section class="intro">
      <h2>Perché un iceberg?</h2>
      <p>I test di interfaccia sono la parte visibile. Sono facili da mostrare e da capire, perché ripetono ciò che farebbe una persona nel prodotto. Ma sono la fetta più piccola di una buona strategia.</p>
      <p>Ogni strato sottostante copre un tipo diverso di guasto. E più si scende, più il feedback è rapido: un test unitario gira in millisecondi, un test di UI può richiedere minuti.</p>
      <p>Questo articolo attraversa i sei strati dell’iceberg, dall’alto verso il basso, con gli strumenti tipici di ciascuno.</p>
      <p class="note">I voti di velocità, stabilità e realismo sono un riferimento generale, non misurazioni. Variano molto da progetto a progetto.</p>
    </section>

    <section class="layer" id="ui" data-layer="ui" style="--c:var(--b1)">
      <h2>Test di UI</h2>
      <p>Controllano un browser o un’app mobile come farebbe una persona: cliccano, digitano e aspettano che la schermata cambi. È l’unico strato che vede l’intero prodotto funzionare insieme.</p>
      <ul class="chips"><li>Playwright</li><li>Cypress</li><li>Selenium</li><li>Appium</li></ul>
      <p>Playwright, Cypress e Selenium automatizzano il web. Appium fa lo stesso per le app mobile.</p>
      <h3>Quando usarli</h3>
      <p>Per pochi flussi critici end-to-end, come login, ricerca e pagamento. Confermano che gli strati sottostanti, messi insieme, offrono un’esperienza che funziona.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Sono i più lenti e i più soggetti a fallimenti intermittenti (i test “flaky”), perché dipendono dalla rete, dalle animazioni e da tutto l’ambiente. Se testi le regole di business dalla schermata, ogni modifica visiva rompe decine di test.</p>
      <p><strong>Regola pratica:</strong> se puoi verificarlo uno strato più in basso, verificalo lì.</p>
      <div class="meters" data-m="1,2,5"></div>
    </section>

    <section class="layer" id="db" data-layer="db" style="--c:var(--b1)">
      <h2>Test di database</h2>
      <p>Verificano lo schema, le migration, le query e le regole che vivono nel database stesso, come vincoli, trigger e stored procedure.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit prepara e confronta insiemi di dati. Flyway applica migration versionate, quindi eseguirle su un database vuoto nell’integrazione continua rivela già molti errori. SQLTest copre routine e query scritte in SQL.</p>
      <h3>Quando usarli</h3>
      <p>Per validare le migration, le query critiche dei report e l’integrità dei dati: chiavi, unicità e valori obbligatori.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Ogni esecuzione deve partire da uno stato noto. Un database condiviso tra i test crea dipendenze invisibili: un test passa solo perché un altro è stato eseguito prima.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)">
      <h2>Test di integrazione</h2>
      <p>Verificano che due o più parti reali dialoghino bene: il tuo servizio con il database, con una coda di messaggi o con un altro servizio.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers avvia dipendenze reali, come database e broker, in container usa e getta. WireMock simula API esterne, comprese risposte lente ed errori. Pytest organizza ed esegue tutto.</p>
      <h3>Quando usarli</h3>
      <p>Per i punti di contatto tra sistemi: come reagisce il tuo codice a un timeout di un servizio di terze parti, a una risposta inattesa o a un messaggio duplicato.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Sono più lenti dei test unitari. Concentrali sui confini e non ripetere qui la logica di business già coperta sotto.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)">
      <h2>Test di API</h2>
      <p>Chiamano direttamente gli endpoint, senza passare dalla schermata. Verificano codici di stato, corpo della risposta, contratto, autenticazione e le regole di business esposte dal servizio.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman è ottimo per esplorare e creare collezioni. Rest Assured (Java), Jest (JavaScript) e Pytest + Requests (Python) permettono di scrivere i test come codice, versionati insieme al progetto.</p>
      <h3>Quando usarli</h3>
      <p>Per validare contratti, permessi e casi di errore: campi mancanti, token non validi, risorse inesistenti. È lo strato con il miglior rapporto tra costo e fiducia per chi consuma l’API.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Un contratto che cambia senza preavviso rompe chi lo consuma. Se più team dipendono dalla stessa API, valuta l’aggiunta di test di contratto.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)">
      <h2>Test di componente e di modulo</h2>
      <p>Testano un pezzo dell’interfaccia in isolamento. Renderizzano il componente, simulano clic e digitazione e verificano cosa appare, senza avviare l’intera app né il backend reale.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>Entrambe le librerie incoraggiano a testare ciò che la persona percepisce sullo schermo, non i dettagli interni di implementazione.</p>
      <h3>Quando usarli</h3>
      <p>Per gli stati di un componente: caricamento, vuoto, errore. Anche per la validazione dei form e il comportamento di pulsanti e menu.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Testare lo stato interno del componente rende fragile la suite: qualsiasi refactoring rompe dei test anche se il comportamento non è cambiato. Meglio verificare il risultato visibile.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)">
      <h2>Test unitari</h2>
      <p>Testano la parte più piccola del codice, una funzione o una classe, isolata dal resto. Girano in millisecondi e indicano la riga esatta in cui qualcosa si è rotto. Sono la base dell’intera suite.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit è lo standard in Java, NUnit in .NET, Pytest in Python e Mocha in JavaScript.</p>
      <h3>Quando usarli</h3>
      <p>Per regole di calcolo, validazioni e casi limite: valori zero, negativi, vuoti, molto grandi.</p>
      <h3>Cosa tenere d’occhio</h3>
      <p>Troppi mock fanno passare il test mentre il sistema fallisce. E i soli test unitari non dimostrano che le parti combacino, ed è per questo che esistono gli strati superiori.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">Quale strato individuerebbe questo bug?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>Come costruire la suite</h2>
      <p>Parti dalla base e sali in base al rischio. Molti test unitari, una buona copertura delle API e integrazione nei punti critici, e pochi test di UI per i flussi che non possono fallire.</p>
      <p>L’obiettivo non è avere uno strato per ogni tipo. È che ogni guasto probabile venga individuato nello strato più economico in grado di vederlo.</p>
    </section>

  <article class="article">
    <section class="intro">
      <h2>Warum ein Eisberg?</h2>
      <p>UI-Tests sind der sichtbare Teil. Sie lassen sich leicht vorführen und verstehen, weil sie nachstellen, was eine Person im Produkt tun würde. Aber sie sind der kleinste Anteil einer guten Strategie.</p>
      <p>Jede Schicht darunter deckt eine andere Art von Fehlern ab. Und je tiefer man geht, desto schneller kommt das Feedback: Ein Unit-Test läuft in Millisekunden, ein UI-Test kann Minuten dauern.</p>
      <p>Dieser Artikel führt von oben nach unten durch die sechs Schichten des Eisbergs, mit den typischen Werkzeugen jeder Schicht.</p>
      <p class="note">Die Bewertungen für Geschwindigkeit, Stabilität und Realitätsnähe sind ein grober Richtwert, keine Messwerte. Sie schwanken stark von Projekt zu Projekt.</p>
    </section>

    <section class="layer" id="ui" data-layer="ui" style="--c:var(--b1)">
      <h2>UI-Tests</h2>
      <p>Sie steuern einen Browser oder eine mobile App so, wie es eine Person tun würde: klicken, tippen und warten, bis sich der Bildschirm ändert. Es ist die einzige Schicht, die das ganze Produkt im Zusammenspiel sieht.</p>
      <ul class="chips"><li>Playwright</li><li>Cypress</li><li>Selenium</li><li>Appium</li></ul>
      <p>Playwright, Cypress und Selenium automatisieren das Web. Appium tut dasselbe für mobile Apps.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Für wenige kritische Ende-zu-Ende-Abläufe, etwa Login, Suche und Bezahlung. Sie bestätigen, dass die Schichten darunter zusammen eine funktionierende Erfahrung liefern.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Sie sind am langsamsten und am anfälligsten für sporadische Fehlschläge (sogenannte „flaky“ Tests), weil sie von Netzwerk, Animationen und der gesamten Umgebung abhängen. Wer Geschäftsregeln über die Oberfläche testet, sieht bei jeder optischen Änderung Dutzende Tests brechen.</p>
      <p><strong>Faustregel:</strong> Wenn sich etwas eine Schicht tiefer prüfen lässt, prüfen Sie es dort.</p>
      <div class="meters" data-m="1,2,5"></div>
    </section>

    <section class="layer" id="db" data-layer="db" style="--c:var(--b1)">
      <h2>Datenbanktests</h2>
      <p>Sie prüfen Schema, Migrationen, Abfragen und die Regeln, die in der Datenbank selbst leben, wie Constraints, Trigger und gespeicherte Prozeduren.</p>
      <ul class="chips"><li>DBUnit</li><li>Flyway</li><li>SQLTest</li></ul>
      <p>DBUnit bereitet Datensätze vor und vergleicht sie. Flyway wendet versionierte Migrationen an; sie in der kontinuierlichen Integration auf einer leeren Datenbank auszuführen, deckt schon viele Fehler auf. SQLTest deckt in SQL geschriebene Routinen und Abfragen ab.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Um Migrationen, kritische Berichtsabfragen und die Datenintegrität zu validieren: Schlüssel, Eindeutigkeit und Pflichtwerte.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Jeder Lauf muss von einem bekannten Zustand ausgehen. Eine zwischen Tests geteilte Datenbank erzeugt unsichtbare Abhängigkeiten: Ein Test besteht nur, weil ein anderer vorher gelaufen ist.</p>
      <div class="meters" data-m="3,4,3"></div>
    </section>

    <section class="layer" id="int" data-layer="int" style="--c:var(--b2)">
      <h2>Integrationstests</h2>
      <p>Sie prüfen, ob zwei oder mehr echte Teile gut zusammenarbeiten: Ihr Dienst mit der Datenbank, mit einer Nachrichtenwarteschlange oder mit einem anderen Dienst.</p>
      <ul class="chips"><li>Pytest</li><li>TestContainers</li><li>WireMock</li></ul>
      <p>TestContainers startet echte Abhängigkeiten, etwa Datenbanken und Broker, in Wegwerf-Containern. WireMock simuliert externe APIs, auch langsame Antworten und Fehler. Pytest organisiert und führt alles aus.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Für die Berührungspunkte zwischen Systemen: wie Ihr Code auf einen Timeout eines Drittanbieter-Dienstes, eine unerwartete Antwort oder eine doppelte Nachricht reagiert.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Sie sind langsamer als Unit-Tests. Konzentrieren Sie sie auf die Schnittstellen und wiederholen Sie hier nicht die Geschäftslogik, die weiter unten schon abgedeckt ist.</p>
      <div class="meters" data-m="2,3,4"></div>
    </section>

    <section class="layer" id="api" data-layer="api" style="--c:var(--b3)">
      <h2>API-Tests</h2>
      <p>Sie rufen die Endpunkte direkt auf, ohne die Oberfläche. Sie prüfen Statuscodes, Antwortinhalt, Vertrag, Authentifizierung und die vom Dienst bereitgestellten Geschäftsregeln.</p>
      <ul class="chips"><li>Postman</li><li>Rest Assured</li><li>Jest</li><li>Pytest + Requests</li></ul>
      <p>Postman eignet sich hervorragend zum Erkunden und für Sammlungen. Mit Rest Assured (Java), Jest (JavaScript) und Pytest + Requests (Python) schreibt man die Tests als Code, versioniert zusammen mit dem Projekt.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Um Verträge, Berechtigungen und Fehlerfälle zu validieren: fehlende Felder, ungültige Tokens, nicht vorhandene Ressourcen. Für alle, die die API nutzen, ist das die Schicht mit dem besten Verhältnis von Aufwand zu Vertrauen.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Ein Vertrag, der sich ohne Ankündigung ändert, bricht seine Nutzer. Wenn mehrere Teams von derselben API abhängen, sollten Sie Vertragstests ergänzen.</p>
      <div class="meters" data-m="4,4,3"></div>
    </section>

    <section class="layer" id="comp" data-layer="comp" style="--c:var(--b4)">
      <h2>Komponenten- und Modultests</h2>
      <p>Sie testen ein Teil der Oberfläche isoliert. Sie rendern die Komponente, simulieren Klicks und Eingaben und prüfen, was erscheint, ohne die gesamte App oder das echte Backend zu starten.</p>
      <ul class="chips"><li>React Testing Library</li><li>Vue Test Utils</li></ul>
      <p>Beide Bibliotheken fördern es, das zu testen, was die Person auf dem Bildschirm wahrnimmt, und nicht interne Implementierungsdetails.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Für die Zustände einer Komponente: Laden, leer, Fehler. Auch für die Formularvalidierung und das Verhalten von Schaltflächen und Menüs.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Wer den internen Zustand einer Komponente testet, macht die Suite brüchig: Jedes Refactoring bricht Tests, obwohl sich das Verhalten nicht geändert hat. Prüfen Sie lieber das sichtbare Ergebnis.</p>
      <div class="meters" data-m="4,4,2"></div>
    </section>

    <section class="layer" id="unit" data-layer="unit" style="--c:var(--b5)">
      <h2>Unit-Tests</h2>
      <p>Sie testen den kleinsten Teil des Codes, eine Funktion oder Klasse, isoliert vom Rest. Sie laufen in Millisekunden und zeigen die genaue Zeile, in der etwas kaputtgegangen ist. Sie sind das Fundament der gesamten Suite.</p>
      <ul class="chips"><li>JUnit</li><li>NUnit</li><li>Pytest</li><li>Mocha</li></ul>
      <p>JUnit ist der Standard in Java, NUnit in .NET, Pytest in Python und Mocha in JavaScript.</p>
      <h3>Wann man sie einsetzt</h3>
      <p>Für Berechnungsregeln, Validierungen und Grenzfälle: Null, negative, leere und sehr große Werte.</p>
      <h3>Worauf man achten sollte</h3>
      <p>Zu viele Mocks lassen einen Test bestehen, während das System versagt. Und Unit-Tests allein beweisen nicht, dass die Teile zusammenpassen – dafür gibt es die oberen Schichten.</p>
      <div class="meters" data-m="5,5,1"></div>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="quizTitle">
      <h2 id="quizTitle">Welche Schicht würde diesen Fehler finden?</h2>
      <p class="progress" id="qProgress"></p>
      <div id="qBody"></div>
    </section>

    <section class="closing">
      <h2>So bauen Sie die Suite auf</h2>
      <p>Beginnen Sie an der Basis und steigen Sie nach Risiko auf. Viele Unit-Tests, solide API-Abdeckung und Integration an den kritischen Stellen, dazu wenige UI-Tests für die Abläufe, die nicht scheitern dürfen.</p>
      <p>Das Ziel ist nicht, von jeder Art eine Schicht zu haben. Es geht darum, dass jeder wahrscheinliche Fehler in der günstigsten Schicht gefunden wird, die ihn sehen kann.</p>
    </section>
